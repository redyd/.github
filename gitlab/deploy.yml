spec:
  inputs:
    image_name:
      type: string
    registry:
      type: string
      default: registry.redyd.dev
    stage:
      type: string
      default: deploy
---
build-and-push:
  stage: $[[ inputs.stage ]]
  image: quay.io/buildah/stable:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_ISOLATION: chroot
    BUILDAH_FORMAT: docker
    IMAGE: $[[ inputs.registry ]]/$[[ inputs.image_name ]]
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - echo "$REGISTRY_PASSWORD" | buildah login -u "$REGISTRY_USER" --password-stdin "$[[ inputs.registry ]]"
    - buildah build -t "$IMAGE:$VERSION" .
    - buildah push "$IMAGE:$VERSION"
    - |
      case "$VERSION" in
        *-*) echo "Prerelease, no latest tag" ;;
        *)   buildah tag "$IMAGE:$VERSION" "$IMAGE:latest" && buildah push "$IMAGE:latest" ;;
      esac
