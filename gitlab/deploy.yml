spec:
  inputs:
    image_name:
      type: string
    registry:
      type: string
      default: registry.redyd.dev
    stage:
      type: string
      default: deploy
---
build-and-push:
  stage: $[[ inputs.stage ]]
  image: docker:27-cli
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/
  variables:
    IMAGE: $[[ inputs.registry ]]/$[[ inputs.image_name ]]
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - echo "$REGISTRY_PASSWORD" | docker login -u "$REGISTRY_USER" --password-stdin "$[[ inputs.registry ]]"
    - docker build -t "$IMAGE:$VERSION" .
    - docker push "$IMAGE:$VERSION"
    - |
      case "$VERSION" in
        *-*) echo "Prerelease, no latest tag" ;;
        *)   docker tag "$IMAGE:$VERSION" "$IMAGE:latest" && docker push "$IMAGE:latest" ;;
      esac
    - docker image rm "$IMAGE:$VERSION" "$IMAGE:latest" 2>/dev/null || true
